services:
  xray-checker:
    build:
      context: .
      args:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
    image: xray-checker:local
    environment:
      SUBSCRIPTION_URL: ${SUBSCRIPTION_URL:?add SUBSCRIPTION_URL to .env}
      # Poll panel metadata, but only check new or changed nodes.
      SUBSCRIPTION_UPDATE: "true"
      SUBSCRIPTION_UPDATE_INTERVAL: "60"
      # Four samples discover rotating pools (including hosts with many nodes)
      # faster; only newly seen endpoints trigger proxy checks.
      SUBSCRIPTION_POOL_SAMPLES: "4"
      SUBSCRIPTION_JSON_FORMAT: "true"
      SUBSCRIPTION_HEADERS: "X-Hwid: ${HWID:?add HWID to .env}"
      # Fast app-style pass: two Apple URL tests, keeping the best latency.
      PROXY_CHECK_CONCURRENCY: "30"
      PROXY_CHECK_INTERVAL: "600"
      PROXY_INITIAL_CHECK_ONLY: "true"
      PROXY_CHECK_METHOD: "urltest"
      PROXY_URL_TEST_URL: "http://captive.apple.com/hotspot-detect.html"
      PROXY_URL_TEST_EXPECTED: "Success"
      PROXY_URL_TEST_ATTEMPTS: "2"
      # ipify is used only when both fast URL tests fail.
      PROXY_IP_CHECK_URL: "https://api.ipify.org?format=text"
      PROXY_TIMEOUT: "4"
      PROXY_RETRY_TIMEOUT: "10"
      PROXY_RETRY_CONCURRENCY: "10"
      NETWORK_STATUS_FILE: "/app/runtime/network-status.json"
      NETWORK_STATUS_MAX_AGE: "15"
      RESULTS_FILE: "/app/data/results.json"
      # Deliberately not cleared by start.sh: IP replacement history survives runs.
      NODE_HISTORY_FILE: "/app/data/node-history.json"
      NODE_DIAGNOSIS_FILE: "/app/data/node-diagnostics.json"
      WEB_SHOW_DETAILS: "true"
    ports:
      - "127.0.0.1:2112:2112"
    volumes:
      - xray-geo:/app/geo
      - xray-network-status:/app/runtime:ro
      - xray-results:/app/data
    depends_on:
      - network-monitor
    restart: unless-stopped

  network-monitor:
    image: xray-checker:local
    user: "0:0"
    entrypoint: ["/bin/sh", "/app/network-watch.sh"]
    environment:
      NETWORK_INTERFACE: "col0"
      NETWORK_CHECK_URL: "https://api.ipify.org?format=text"
      NETWORK_CHECK_INTERVAL: "3"
      NETWORK_STATUS_FILE: "/app/runtime/network-status.json"
    network_mode: host
    volumes:
      - ./network-watch.sh:/app/network-watch.sh:ro
      - xray-network-status:/app/runtime
    restart: unless-stopped

volumes:
  xray-geo:
  xray-network-status:
  xray-results:
