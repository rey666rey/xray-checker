openapi: 3.0.3
info:
  title: Xray Checker API
  description: API for monitoring Xray proxy status and configuration
  version: "1.0"
servers:
  - url: /
security:
  - basicAuth: []

paths:
  /api/v1/public/proxies:
    get:
      summary: List all proxies (public)
      description: Returns a list of all proxies with status. No authentication required. Does not expose sensitive data like server IPs and ports.
      tags:
        - Public
      security: []
      responses:
        '200':
          description: List of proxies with public info only
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicProxyInfo'

  /api/v1/proxies:
    get:
      summary: List all proxies
      description: Returns a list of all proxies with status information
      tags:
        - Proxies
      responses:
        '200':
          description: List of proxies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProxyInfo'

  /api/v1/proxies/{stableID}:
    get:
      summary: Get proxy by ID
      description: Returns information for a specific proxy
      tags:
        - Proxies
      parameters:
        - name: stableID
          in: path
          required: true
          schema:
            type: string
          description: Proxy Stable ID (16-character hash)
      responses:
        '200':
          description: Proxy details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProxyInfo'
        '404':
          description: Proxy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

  /api/v1/proxies/{stableID}/recheck:
    post:
      summary: Recheck one proxy now
      description: Runs an immediate priority Apple URL test and returns the completed proxy result.
      tags:
        - Proxies
      parameters:
        - name: stableID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Completed recheck result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/nodes:
    get:
      summary: List physical endpoint nodes
      description: Groups every host/inbound binding that currently uses the same endpoint IP.
      tags:
        - Nodes
      responses:
        '200':
          description: Node-centric topology
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NodeGroupInfo'

  /api/v1/nodes/{nodeID}/recheck:
    post:
      summary: Recheck every binding on one node
      description: Runs an immediate priority Apple URL test for every current binding on the node and returns after completion.
      tags:
        - Nodes
      parameters:
        - name: nodeID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node recheck completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/nodes/{nodeID}/diagnose:
    post:
      summary: Start a deep diagnosis of one physical node
      description: Verifies the monitored route, endpoint ports, configured TLS/Reality SNI values, and real Xray tunnels. Only one diagnosis runs at a time.
      tags:
        - Nodes
      parameters:
        - name: nodeID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Diagnosis queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NodeDiagnosis'
        '409':
          description: Another diagnosis is already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

  /api/v1/nodes/{nodeID}/diagnosis:
    get:
      summary: Get recent manual diagnosis history
      tags:
        - Nodes
      parameters:
        - name: nodeID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Newest-first diagnosis history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NodeDiagnosis'

  /api/v1/access-checks:
    get:
      summary: List recent direct-vs-VPN access checks
      description: Returns up to 20 checks, newest first. This endpoint is available only on the private API.
      tags:
        - Access checks
      responses:
        '200':
          description: Recent access-check history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AccessCheck'
    post:
      summary: Start a direct-vs-VPN access check
      description: Checks the selected protocol directly through the iPhone route. Only when direct access fails, repeats it through up to three healthy Xray routes. Only one access check runs at a time.
      tags:
        - Access checks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessCheckRequest'
      responses:
        '200':
          description: Access check queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AccessCheck'
        '400':
          description: Invalid or unsafe target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '409':
          description: Another access check is already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

  /api/v1/access-checks/{runID}:
    get:
      summary: Get one access check
      tags:
        - Access checks
      parameters:
        - name: runID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current or completed access check
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AccessCheck'
        '404':
          description: Access check not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

  /api/v1/status:
    get:
      summary: Get system status
      description: Returns summary statistics about all proxies
      tags:
        - Status
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StatusResponse'

  /api/v1/config:
    get:
      summary: Get current configuration
      description: Returns the current checker configuration
      tags:
        - Config
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ConfigResponse'

  /api/v1/system/info:
    get:
      summary: Get system info
      description: Returns version, uptime, and instance information
      tags:
        - System
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemInfoResponse'

  /api/v1/system/ip:
    get:
      summary: Get current IP
      description: Returns the current detected IP address
      tags:
        - System
      responses:
        '200':
          description: Current IP address
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemIPResponse'
        '500':
          description: Failed to get IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

  /api/v1/network:
    get:
      summary: Get mobile network status
      description: Returns the monitored iPhone route state used to pause and resume proxy checks
      tags:
        - System
      responses:
        '200':
          description: Current mobile network state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NetworkStatus'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:
    APIResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Response data (varies by endpoint)
        error:
          type: string
          description: Error message (only present on failure)

    APIErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Proxy not found"

    PublicProxyInfo:
      type: object
      description: Public proxy info without sensitive data (server IPs, ports)
      properties:
        stableId:
          type: string
          example: "a1b2c3d4e5f67890"
        name:
          type: string
          example: "US-Server-1"
        groupName:
          type: string
          description: Group name (e.g. a balancer group); empty for ungrouped proxies
          example: ""
        online:
          type: boolean
          example: true
        unstable:
          type: boolean
          description: True when the node succeeded only through fallback or the retry pass
          example: false
        latencyMs:
          type: integer
          format: int64
          example: 150
        lastCheck:
          type: integer
          format: int64
          description: Unix timestamp (seconds) of the last check; 0 if not checked yet
          example: 1751130000
        monitorState:
          $ref: '#/components/schemas/NodeState'
        consecutiveFailures:
          type: integer
          example: 0
        addressChangedAt:
          type: integer
          format: int64
          description: Unix timestamp of the most recent endpoint change

    ProxyInfo:
      type: object
      properties:
        index:
          type: integer
          example: 0
        stableId:
          type: string
          example: "a1b2c3d4e5f67890"
        name:
          type: string
          example: "US-Server-1"
        subName:
          type: string
          description: Subscription name this proxy belongs to
          example: "Premium VPN"
        groupName:
          type: string
          description: Group name (e.g. a balancer group); empty for ungrouped proxies
          example: ""
        server:
          type: string
          example: "192.168.1.1"
        port:
          type: integer
          example: 443
        protocol:
          type: string
          enum: [vless, vmess, trojan, shadowsocks, hysteria, socks, http, wireguard]
          example: "vless"
        proxyPort:
          type: integer
          example: 10000
        online:
          type: boolean
          example: true
        unstable:
          type: boolean
          description: True when the node succeeded only through fallback or the retry pass
          example: false
        latencyMs:
          type: integer
          format: int64
          example: 150
        lastCheck:
          type: integer
          format: int64
          description: Unix timestamp (seconds) of the last check; 0 if not checked yet
          example: 1751130000
        logicalId:
          type: string
          description: Stable identity of one checkable host/endpoint binding
        hostId:
          type: string
          description: Subscription host/inbound identity, shared by every endpoint in its pool
        nodeId:
          type: string
          description: Physical endpoint identity, shared by every host bound to the same server
        monitorState:
          $ref: '#/components/schemas/NodeState'
        previousAddress:
          type: string
          description: Previous configured endpoint after a change
        resolvedIps:
          type: array
          items:
            type: string
        previousResolvedIps:
          type: array
          items:
            type: string
        addressChangedAt:
          type: integer
          format: int64
        consecutiveFailures:
          type: integer
        consecutiveSuccesses:
          type: integer
        lastSuccess:
          type: integer
          format: int64
        lastError:
          type: string
        exitIp:
          type: string
        nextCheck:
          type: integer
          format: int64
        endpointFirstSeen:
          type: integer
          format: int64
        endpointLastSeen:
          type: integer
          format: int64
        endpointMissingPolls:
          type: integer
          description: Successful subscription polls since this endpoint was last observed
        metricsLabels:
          type: object
          additionalProperties:
            type: string
          description: Operator-defined static labels from the outbound JSON (metricsLabels), also exported as Prometheus labels
          example:
            location: "Netherlands, Amsterdam"
            hoster: "FreeVDS"

    NodeGroupInfo:
      type: object
      properties:
        nodeId:
          type: string
        server:
          type: string
          description: Endpoint address; omitted when server details are disabled
        state:
          type: string
          enum: [unknown, healthy, unstable, degraded, offline, missing]
        totalBindings:
          type: integer
        onlineBindings:
          type: integer
        unstableBindings:
          type: integer
        repairBindings:
          type: integer
        hostCount:
          type: integer
        missing:
          type: boolean
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/ProxyInfo'
        diagnosis:
          $ref: '#/components/schemas/NodeDiagnosis'

    NodeDiagnosis:
      type: object
      properties:
        runId:
          type: string
        nodeId:
          type: string
        server:
          type: string
        revision:
          type: string
        probeId:
          type: string
          example: local:col0
        interface:
          type: string
          example: col0
        sourceIp:
          type: string
        state:
          type: string
          enum: [queued, running, completed]
        stage:
          type: string
          enum: [queued, network_control, direct_endpoint, xray_tunnels, completed]
        verdict:
          type: string
          enum: [healthy, degraded, net_unreachable, handshake_failed, tunnel_failed, inconclusive]
        summary:
          type: string
        startedAt:
          type: integer
          format: int64
        completedAt:
          type: integer
          format: int64
        stale:
          type: boolean
        control:
          $ref: '#/components/schemas/ControlDiagnosis'
        ports:
          type: array
          items:
            $ref: '#/components/schemas/PortDiagnosis'
        tls:
          type: array
          items:
            $ref: '#/components/schemas/TLSProbeDiagnosis'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/BindingDiagnosis'

    ControlDiagnosis:
      type: object
      properties:
        url:
          type: string
        online:
          type: boolean
        statusCode:
          type: integer
        latencyMs:
          type: integer
          format: int64
        observedIp:
          type: string
        error:
          type: string

    PortDiagnosis:
      type: object
      properties:
        port:
          type: integer
        network:
          type: string
          enum: [tcp, udp]
        attempts:
          type: integer
        successes:
          type: integer
        bestLatencyMs:
          type: integer
          format: int64
        lastError:
          type: string

    TLSProbeDiagnosis:
      allOf:
        - $ref: '#/components/schemas/PortDiagnosis'
        - type: object
          properties:
            serverName:
              type: string
            peerName:
              type: string

    BindingDiagnosis:
      type: object
      properties:
        stableId:
          type: string
        hostId:
          type: string
        name:
          type: string
        protocol:
          type: string
        security:
          type: string
        port:
          type: integer
        serverName:
          type: string
        attempts:
          type: integer
        successes:
          type: integer
        bestLatencyMs:
          type: integer
          format: int64
        failureStage:
          type: string
          enum: [tunnel, response]
        lastError:
          type: string

    AccessCheckRequest:
      type: object
      required: [ip, port, method]
      properties:
        ip:
          type: string
          description: Public unicast IPv4 or IPv6 address
        port:
          type: integer
          minimum: 1
          maximum: 65535
        method:
          type: string
          enum: [tcp, ssh, tls, http, https]
        serverName:
          type: string
          description: Optional TLS SNI for TLS and HTTPS
        httpHost:
          type: string
          description: Optional HTTP Host header for HTTP and HTTPS
        path:
          type: string
          default: /
        expectedStatus:
          type: integer
          minimum: 100
          maximum: 599
        expectedText:
          type: string

    AccessRouteResult:
      type: object
      properties:
        route:
          type: string
          enum: [direct, vpn]
        nodeId:
          type: string
        name:
          type: string
        exitIp:
          type: string
        attempts:
          type: integer
        successes:
          type: integer
        tcpConnected:
          type: boolean
        protocolMatched:
          type: boolean
        bestLatencyMs:
          type: integer
          format: int64
        banner:
          type: string
        tlsVersion:
          type: string
        peerName:
          type: string
        statusCode:
          type: integer
        lastError:
          type: string

    AccessCheck:
      allOf:
        - $ref: '#/components/schemas/AccessCheckRequest'
        - type: object
          properties:
            runId:
              type: string
            state:
              type: string
              enum: [queued, running, completed]
            stage:
              type: string
              enum: [queued, direct, vpn, completed]
            verdict:
              type: string
              enum: [available, available_unstable, blocked, unavailable, inconclusive, interrupted]
            summary:
              type: string
            sourceIp:
              type: string
            interface:
              type: string
            startedAt:
              type: integer
              format: int64
            completedAt:
              type: integer
              format: int64
            direct:
              $ref: '#/components/schemas/AccessRouteResult'
            vpn:
              type: array
              items:
                $ref: '#/components/schemas/AccessRouteResult'

    StatusResponse:
      type: object
      properties:
        total:
          type: integer
          example: 10
        online:
          type: integer
          example: 8
        offline:
          type: integer
          example: 2
        unstable:
          type: integer
          description: Online nodes that required fallback or the retry pass
          example: 1
        avgLatencyMs:
          type: integer
          format: int64
          example: 200
        needsReplacement:
          type: integer
          example: 2
        verifying:
          type: integer
          example: 1

    NodeState:
      type: string
      enum:
        - unknown
        - healthy
        - unstable
        - suspected
        - needs_replacement
        - ip_changed
        - verifying_new_ip
        - fixed
        - new_ip_failed

    ConfigResponse:
      type: object
      properties:
        checkInterval:
          type: integer
          example: 300
        initialCheckOnly:
          type: boolean
          description: Run one full check after startup without scheduled bulk rechecks; targeted repair checks continue
          example: false
        checkMethod:
          type: string
          enum: [urltest, ip, status, download]
          example: "urltest"
        timeout:
          type: integer
          example: 30
        startPort:
          type: integer
          example: 10000
        subscriptionUpdate:
          type: boolean
          example: true
        subscriptionPoolSamples:
          type: integer
          description: Independent subscription samples merged per update cycle
          example: 4
        subscriptionUpdateInterval:
          type: integer
          example: 300
        simulateLatency:
          type: boolean
          example: true
        subscriptionNames:
          type: array
          description: List of unique subscription names
          items:
            type: string
          example: ["Premium VPN", "Basic VPN"]

    SystemInfoResponse:
      type: object
      properties:
        version:
          type: string
          example: "1.0.0"
        uptime:
          type: string
          example: "1h 30m 45s"
        uptimeSec:
          type: integer
          format: int64
          example: 5445
        instance:
          type: string
          example: "prod-1"

    SystemIPResponse:
      type: object
      properties:
        ip:
          type: string
          example: "203.0.113.1"

    NetworkStatus:
      type: object
      properties:
        managed:
          type: boolean
          example: true
        ready:
          type: boolean
          example: true
        state:
          type: string
          enum: [unmanaged, connected, waiting, recovering, stopped, unknown]
          example: connected
        interface:
          type: string
          example: col0
        localIp:
          type: string
          example: "172.20.10.2"
        publicIp:
          type: string
          example: "203.0.113.1"
        message:
          type: string
          example: iPhone mobile route is active
        updatedAt:
          type: integer
          format: int64
          description: Unix timestamp of the last host monitor update
          example: 1787461200
