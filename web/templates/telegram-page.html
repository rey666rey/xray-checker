{{ define "telegram-page" }}
<section x-cloak x-show="activeView === 'alerts'" aria-labelledby="telegram-title" class="ws-telegram">
  <div class="ws-title-row"><div><div class="ws-eyebrow">Отдельный канал уведомлений</div><h1 id="telegram-title">Telegram-алерты</h1><p>Что отправлять, как доставлять и как не утонуть в сообщениях.</p></div><span class="ws-chip" :data-tone="telegramStatus.state === 'error' ? 'error' : (telegramStatus.connected ? 'good' : 'muted')"><span class="ws-dot"></span><span x-text="alertsStatusLabel"></span></span></div>
  <div class="ws-banner" data-tone="error" x-show="telegramError" role="alert"><p x-text="telegramError"></p></div>
  <div class="ws-empty" x-show="alertsLoading"><span class="alerts-spinner"></span><p>Загружаем настройки…</p></div>
  {{ template "telegram-setup" . }}
  <template x-if="!alertsLoading && telegramStatus.configured && !telegramReplacing">
    <div class="ws-alert-layout">
      <div>
        <section class="ws-surface"><div class="ws-row"><h2>Доставка</h2><button type="button" class="ws-switch" role="switch" :aria-checked="telegramStatus.enabled" aria-label="Отправлять уведомления" :disabled="telegramBusy" @click="toggleTelegramEnabled()"><span></span></button></div><p x-text="telegramStatus.enabled ? 'Уведомления включены. Мониторинг работает независимо от доставки.' : 'Уведомления приостановлены. Мониторинг продолжает работать.'"></p>
          <dl class="ws-properties"><div><dt>Бот</dt><dd x-text="telegramStatus.botUsername ? '@' + telegramStatus.botUsername : 'Настроен'"></dd></div><div><dt>Получатель</dt><dd x-text="telegramStatus.recipient || 'Настроенный чат'"></dd></div><div><dt>Последняя доставка</dt><dd x-text="telegramStatus.lastDeliveryAt ? formatTimestamp(telegramStatus.lastDeliveryAt) : 'Сообщений ещё не было'"></dd></div></dl>
          <div class="ws-route-options" aria-label="Маршрут доставки"><template x-for="route in telegramDeliveryOptions" :key="route.key"><button type="button" :aria-pressed="telegramDeliveryMode === route.key" :disabled="telegramBusy" @click="telegramDeliveryMode = route.key; telegramSettingsDirty = true"><strong x-text="route.shortLabel"></strong><small x-text="route.key === 'auto' ? 'Через рабочие Xray' : (route.key === 'direct' ? 'Без прокси' : 'Свой прокси')"></small></button></template></div>
          <p class="ws-muted" x-text="telegramDeliveryDescription"></p><label x-show="telegramDeliveryMode === 'custom'" class="ws-field">Адрес прокси<input type="password" x-model="telegramCustomProxy" @input="telegramSettingsDirty = true" placeholder="socks5h://user:password@host:1080" autocomplete="new-password" :disabled="telegramStatus.proxyManagedByEnvironment || telegramBusy" /><span class="ws-muted" x-text="telegramStatus.proxyManagedByEnvironment ? 'Прокси задан через TELEGRAM_PROXY_URL.' : 'Пустое поле сохраняет ранее настроенный прокси.'"></span></label>
          <div class="ws-note" x-show="telegramStatus.managedByEnvironment"><strong>Токен задан на сервере</strong><p>Токен скрыт. Категории уведомлений и группировка доступны ниже.</p></div>
          <div class="ws-note" data-tone="error" x-show="telegramStatus.lastError && !telegramError"><strong>Ошибка доставки</strong><p x-text="telegramStatus.lastError"></p></div>
        </section>
        <section class="ws-surface"><h2>Какие события присылать</h2><div class="ws-check-list"><template x-for="option in telegramPreferenceOptions" :key="option.key"><label class="ws-check-row"><input type="checkbox" x-model="telegramPreferences[option.key]" @change="telegramSettingsDirty = true" :disabled="telegramBusy" /><span><strong x-text="option.label"></strong><small x-text="option.description"></small></span></label></template></div></section>
        <section class="ws-surface"><h2>Во время волны ошибок</h2><p>События накапливаются в сводку. Один и тот же эпизод не отправляется после каждого теста.</p><div class="ws-form-grid"><label class="ws-field">Окно сводки, секунды<input type="number" min="5" max="300" x-model.number="telegramPreferences.batchWindowSec" @input="telegramSettingsDirty = true" :disabled="telegramBusy" /></label><label class="ws-field">Повтор нерешённых, часы<input type="number" min="0" max="168" x-model.number="telegramPreferences.repeatHours" @input="telegramSettingsDirty = true" :disabled="telegramBusy" /><small>0 — без повторных напоминаний</small></label></div><p class="ws-muted">Уведомления охватывают все панели и активную сеть проверок. Имена панелей указываются в сообщении; отдельного фильтра доставки по панелям пока нет.</p><div class="ws-panel-tags"><template x-for="panel in panelSummaries" :key="panel.name"><span class="ws-chip" data-tone="muted" x-text="panel.name"></span></template></div></section>
        <div class="ws-save-bar"><span class="ws-muted" x-text="telegramSettingsDirty ? 'Есть несохранённые изменения' : 'Настройки сохранены'"></span><div><button type="button" class="ws-button" :disabled="telegramBusy || !telegramSettingsDirty" @click="loadTelegramStatus()">Сбросить изменения</button><button type="button" class="ws-button ws-primary" :disabled="telegramBusy || !telegramSettingsDirty" @click="saveTelegramPreferences()" x-text="telegramBusy ? 'Сохраняем…' : 'Сохранить настройки'"></button></div></div>
        <details class="ws-surface ws-account-settings"><summary>Управление подключением</summary><div class="ws-source-actions"><button type="button" class="ws-button" :disabled="telegramBusy || telegramStatus.managedByEnvironment" @click="beginTelegramReplacement()">Заменить бота</button><button type="button" class="ws-button ws-danger" :disabled="telegramBusy || telegramStatus.managedByEnvironment" @click="telegramDisconnectOpen = true">Отключить Telegram</button></div><p class="ws-muted" x-show="telegramStatus.managedByEnvironment">Подключение задано переменными окружения.</p></details>
      </div>
      <aside class="ws-surface ws-alert-preview" aria-label="Предпросмотр уведомления"><div class="ws-eyebrow">Предпросмотр</div><h2>Как это выглядит в Telegram</h2><p>Пример формата по текущему черновику. Сообщение не отправляется.</p><label class="ws-field">Событие<select x-model="alertPreviewKind"><template x-for="option in telegramPreferenceOptions" :key="option.key"><option :value="option.key" :selected="alertPreviewKind === option.key" x-text="option.label"></option></template></select></label><div class="ws-note" x-show="!telegramStatus.enabled || !telegramPreferences[alertPreviewKind]" data-tone="warn"><p x-text="!telegramStatus.enabled ? 'Доставка сейчас выключена.' : 'Этот тип уведомлений выключен в черновике.'"></p></div><div class="ws-message"><strong x-text="alertPreviewTitle"></strong><p x-text="alertPreviewBody"></p><small>Пример · не отправлен</small></div><dl class="ws-properties"><div><dt>Окно сводки</dt><dd x-text="telegramPreferences.batchWindowSec + ' с'"></dd></div><div><dt>Маршрут</dt><dd x-text="telegramDeliveryLabel"></dd></div></dl><button type="button" class="ws-button" @click="sendTelegramTest()" :disabled="telegramBusy || !telegramStatus.enabled || telegramSettingsDirty" x-text="telegramTestState === 'sending' ? 'Отправляем…' : 'Отправить тест в Telegram'"></button><p class="ws-muted" x-show="telegramSettingsDirty">Перед тестом сохраните или сбросьте черновик.</p><p class="text-online" x-show="telegramTestState === 'success'" role="status">Telegram принял тестовое сообщение.</p><p class="ws-inspector-note">Тест действительно отправляет сообщение. При недоступном канале мгновенная доставка не гарантируется.</p></aside>
    </div>
  </template>
</section>
<div x-cloak x-show="telegramDisconnectOpen || telegramDiscardOpen" class="ws-confirm-backdrop" x-effect="handleAlertDialog(telegramDisconnectOpen || telegramDiscardOpen)" @keydown.escape.window="telegramDisconnectOpen = false; telegramDiscardOpen = false" @click.self="telegramDisconnectOpen = false; telegramDiscardOpen = false">
  <div class="ws-confirm ws-surface" x-ref="alertConfirm" @keydown.tab="trapAlertDialog($event)" role="alertdialog" aria-modal="true" aria-labelledby="ws-confirm-title"><h2 id="ws-confirm-title" x-text="telegramDisconnectOpen ? 'Отключить Telegram?' : 'Сбросить несохранённые изменения?'"></h2><p x-text="telegramDisconnectOpen ? 'Доставка остановится. Сохранённый токен и получатель будут удалены; категории уведомлений останутся.' : 'Подключение Telegram сохранится, но изменения черновика будут потеряны.'"></p><div class="ws-source-actions"><button type="button" class="ws-button" :disabled="telegramBusy" @click="telegramDisconnectOpen = false; telegramDiscardOpen = false">Продолжить редактирование</button><button type="button" class="ws-button ws-danger" :disabled="telegramBusy" @click="telegramDisconnectOpen ? disconnectTelegram() : discardAlertNavigation()" x-text="telegramDisconnectOpen ? 'Отключить' : 'Сбросить и перейти'"></button></div></div>
</div>
{{ end }}
